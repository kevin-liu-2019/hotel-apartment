server:
  port: 8081

spring:
  application:
    name: hotel-admin
  datasource:
    url: jdbc:mysql://localhost:3306/hotel_apartment?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false
    username: root
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest

mybatis-plus:
  mapper-locations: classpath*:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

jwt:
  secret: hotel-apartment-secret-key-must-be-at-least-256-bits-long-for-hs256
  expiration: 28800000

knife4j:
  enable: true
  openapi:
    title: 酒店公寓管理后台 API
    description: 酒店公寓管理后台接口文档
    version: 1.0.0

logging:
  level:
    com.hotel.apartment: debug
